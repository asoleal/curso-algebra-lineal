name: Publicar sitio y PDF

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias Python
        run: pip install jupyter nbclient numpy sympy matplotlib scipy scikit-learn plotly kaleido

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar Tectonic (motor PDF)
        run: |
          cd "$HOME"
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          echo "$HOME" >> "$GITHUB_PATH"

      - name: Renderizar sitio + PDF
        run: quarto render

      - name: Subir artefacto a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
