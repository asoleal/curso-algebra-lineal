# ============================================================
# Configuración fuente única: sitio web + libro PDF
# Quarto Book: un mismo .qmd alimenta las dos salidas
# ============================================================
project:
  type: book
  output-dir: _book

lang: es

execute:
  echo: true
  warning: false

book:
  title: "Álgebra Lineal con Aplicaciones e Inteligencia Artificial"
  subtitle: "Curso interactivo "
  author: "John Jairo Leal Gómez"
  date: today
  date-format: "D [de] MMMM [de] YYYY"
  site-url: "https://asoleal.github.io/curso-algebra-lineal/"
  repo-url: "https://github.com/asoleal/curso-algebra-lineal"
  repo-branch: main
  page-navigation: true
  downloads: [pdf]
  chapters:
    - index.qmd
    - prefacio.qmd
    - part: "Unidad 1. Sistemas de ecuaciones lineales y matrices"
      chapters:
        - unidades/u1-sistemas/1.1-sistemas-lineales.qmd
        - unidades/u1-sistemas/1.2-gauss-jordan.qmd
        - unidades/u1-sistemas/1.3-sistemas-homogeneos.qmd
        - unidades/u1-sistemas/1.4-operaciones-matrices.qmd
        - unidades/u1-sistemas/1.5-matriz-inversa.qmd
        - unidades/u1-sistemas/1.6-factorizacion-lu.qmd
        - unidades/u1-sistemas/1.7-matrices-elementales.qmd
        - unidades/u1-sistemas/1.8-matrices-graficas.qmd

format:
  html:
    number-sections: true
    theme:
      light: cosmo
      dark: darkly
    css: assets/css/custom.css
    code-copy: true
    code-tools: true
    toc: true
    toc-depth: 3
    toc-title: "En esta página"
    highlight-style: github

pdf:
  number-sections: true
  pdf-engine: tectonic
  documentclass: report
  papersize: a4
  toc-depth: 2
  fig-pos: "H"
  geometry:
    - margin=2.2cm
  include-in-header:
    text: |
      \raggedbottom
      \setlength{\intextsep}{10pt plus 2pt minus 2pt}
      \setlength{\abovecaptionskip}{6pt}
      \setlength{\belowcaptionskip}{4pt}
      \setkeys{Gin}{width=0.72\linewidth}
